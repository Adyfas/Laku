<!-- Bu Siti SVG Character — Parts terpisah untuk animasi individual -->
<!-- Digunakan di dalam #learnSitiFigure menggantikan PNG -->
<svg id="buSitiSvg" viewBox="0 0 280 380" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
  <!-- Background glow -->
  <defs>
    <radialGradient id="sitiGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#e2ffc8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e2ffc8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="140" cy="360" rx="100" ry="20" fill="url(#sitiGlow)"/>

  <!-- === BODY (apron + dress) === -->
  <g id="sitiBody" class="siti-body">
    <!-- Dress -->
    <path d="M90 200 Q85 260 80 340 L200 340 Q195 260 190 200 Z" fill="#274c43"/>
    <!-- Apron -->
    <path d="M100 220 Q105 280 108 330 L172 330 Q175 280 180 220 Z" fill="#fafaf7"/>
    <!-- Apron strings -->
    <path d="M100 220 Q90 215 85 220" stroke="#274c43" fill="none" stroke-width="2"/>
    <path d="M180 220 Q190 215 195 220" stroke="#274c43" fill="none" stroke-width="2"/>
    <!-- Apron pocket -->
    <rect x="125" y="260" width="30" height="20" rx="4" fill="none" stroke="#274c43" stroke-width="1.5"/>
  </g>

  <!-- === HEAD === -->
  <g id="sitiHead" class="siti-head">
    <!-- Neck -->
    <rect x="130" y="180" width="20" height="25" rx="8" fill="#D4A574"/>
    <!-- Face -->
    <ellipse cx="140" cy="155" rx="42" ry="48" fill="#D4A574"/>
    <!-- Hijab -->
    <path d="M95 140 Q95 90 140 85 Q185 90 185 140 Q185 165 180 175 L100 175 Q95 165 95 140 Z" fill="#274c43"/>
    <path d="M95 140 Q90 145 88 155 Q92 160 100 165" fill="#274c43"/>
    <path d="M185 140 Q190 145 192 155 Q188 160 180 165" fill="#274c43"/>
    <!-- Hijab fold detail -->
    <path d="M120 90 Q130 100 140 95" stroke="#1f3d36" fill="none" stroke-width="1" opacity="0.3"/>

    <!-- Eyes -->
    <g id="sitiEyes" class="siti-eyes">
      <ellipse cx="125" cy="150" rx="5" ry="6" fill="#2a2b2f"/>
      <ellipse cx="155" cy="150" rx="5" ry="6" fill="#2a2b2f"/>
      <!-- Eye highlights -->
      <circle cx="127" cy="148" r="1.5" fill="white"/>
      <circle cx="157" cy="148" r="1.5" fill="white"/>
    </g>

    <!-- Mouth — neutral by default, changed via JS -->
    <g id="sitiMouth" class="siti-mouth">
      <path id="sitiMouthPath" d="M132 168 Q140 173 148 168" stroke="#8B5E3C" fill="none" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Blush -->
    <ellipse cx="118" cy="162" rx="8" ry="4" fill="#FFB5B5" opacity="0.4"/>
    <ellipse cx="162" cy="162" rx="8" ry="4" fill="#FFB5B5" opacity="0.4"/>
  </g>

  <!-- === LEFT ARM (wave, gesture) === -->
  <g id="sitiLeftArm" class="siti-left-arm" style="transform-origin: 95px 210px;">
    <path d="M95 210 Q70 230 55 265 Q50 275 60 278" stroke="#D4A574" fill="none" stroke-width="16" stroke-linecap="round"/>
    <!-- Hand -->
    <circle cx="60" cy="278" r="10" fill="#D4A574"/>
  </g>

  <!-- === RIGHT ARM (cook, point) === -->
  <g id="sitiRightArm" class="siti-right-arm" style="transform-origin: 185px 210px;">
    <path d="M185 210 Q210 230 225 260 Q230 270 220 275" stroke="#D4A574" fill="none" stroke-width="16" stroke-linecap="round"/>
    <!-- Hand holding spatula -->
    <circle cx="220" cy="275" r="10" fill="#D4A574"/>
    <!-- Spatula -->
    <line x1="220" y1="265" x2="235" y2="240" stroke="#8B5E3C" stroke-width="3" stroke-linecap="round"/>
    <rect x="230" y="228" width="18" height="12" rx="3" fill="#8B5E3C"/>
  </g>

  <!-- === WOK (cooking prop) === -->
  <g id="sitiWok" class="siti-wok">
    <ellipse cx="220" cy="290" rx="30" ry="8" fill="#555"/>
    <path d="M190 290 Q190 320 220 325 Q250 320 250 290" fill="#444"/>
    <!-- Steam -->
    <g id="sitiSteam" class="siti-steam" opacity="0.4">
      <path d="M210 275 Q215 260 210 250" stroke="#999" fill="none" stroke-width="1.5">
        <animate attributeName="d" values="M210 275 Q215 260 210 250;M210 275 Q205 258 212 248;M210 275 Q215 260 210 250" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M225 278 Q230 263 225 253" stroke="#999" fill="none" stroke-width="1.5">
        <animate attributeName="d" values="M225 278 Q230 263 225 253;M225 278 Q220 261 227 251;M225 278 Q230 263 225 253" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- === SHOES === -->
  <ellipse cx="115" cy="345" rx="18" ry="8" fill="#333"/>
  <ellipse cx="165" cy="345" rx="18" ry="8" fill="#333"/>
</svg>
